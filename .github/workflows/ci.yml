name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format · lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mirrors the local gate: prettier --check, eslint, tsc --noEmit, vitest run.
      # Deterministic by construction — no network, DB, or AWS credentials needed
      # (live-IPFS / live-DB paths are opt-in behind env flags and excluded here).
      - name: Check
        run: pnpm run check
